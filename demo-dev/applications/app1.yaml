apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: app1
  source:
    path: "HelmCharts/openresty-art"
    repoURL: "git@github.com:dxclxs/argocd.git"
    targetRevision: main
    helm:
      valuesFiles:
        - values.yaml
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
